[project]
name = "pinky"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Justyr", email = "h94u041@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pinky = "pinky:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
